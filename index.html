<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Carrom Board Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      text-align: center;
      background-color: #f2f2f2;
    }
    canvas {
      background-color: #f5deb3;
      border: 10px solid #5c4033;
      border-radius: 10px;
      display: block;
      margin: 20px auto;
    }
    #scoreBoard {
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>🎯 Carrom Board Game</h1>
  <div id="scoreBoard">
    Player 1: <span id="p1">0</span> | Player 2: <span id="p2">0</span>
  </div>

  <canvas id="board" width="600" height="600"></canvas>

  <script src="game.js"></script>
</body>
</html>
